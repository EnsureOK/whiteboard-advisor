name: test

# 后端 pytest(105 个测试,FakeLLM 无外网依赖) + 前端 tsc 构建。
# push 到 main / 所有 PR 均跑,防止只重打包不重质量。

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend-pytest
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # 测试全程不依赖外部 key(FakeLLM + mock embedding)
      - run: python -m pytest

  frontend:
    name: frontend-build
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # tsc -b 严格类型检查 + 产物构建
      - run: npm run build

  security:
    name: dependency-audit
    runs-on: ubuntu-22.04
    continue-on-error: true  # Python 3.9 下 multipart/urllib3/starlette 等已到版本上限,升级 3.10+ 后改为阻塞
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: pip install -r requirements.txt pip-audit
      - run: python -m pip_audit -l
